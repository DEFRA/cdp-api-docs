services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
      - ./test-site:/test-site:ro
    networks:
      - cdp-tenant

  cdp-api-docs:
    build: ./
    ports:
      - '8085:8085'
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      BUCKET: cdp-local-api-docs
      SYNC_INTERVAL_SECONDS: 10
    networks:
      - cdp-tenant

networks:
  cdp-tenant:
    driver: bridge
